<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento da clínica</title><link rel="stylesheet" href="/web/style.css"><script src="/web/chat.js" defer></script></head><body><header><h1>Atendimento da clínica</h1><a href="/recepcao">Recepção</a></header><main class="chat-page"><p>Agende uma consulta, tire dúvidas ou peça para falar com um atendente.</p><form id="identificar" class="row"><label>Seu telefone com DDD<input id="telefone" type="tel" autocomplete="tel" required placeholder="DDD e número"></label><button>Iniciar conversa</button></form><section id="chat" aria-label="Conversa"><div id="mensagens" class="chat-log" role="log" aria-live="polite"></div><form id="enviar" hidden><label>Sua mensagem<textarea id="texto" required maxlength="4000" placeholder="Ex.: quero agendar uma consulta"></textarea></label><p><button>Enviar mensagem</button></p></form><p id="aviso" role="status" class="notice"></p></section><p class="muted">Em uma emergência, ligue 192 ou procure um pronto-socorro.</p><noscript>Ative JavaScript no navegador para conversar.</noscript></main></body></html>
